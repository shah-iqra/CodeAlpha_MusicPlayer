<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music Player | CodeAlpha</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="player-container">

    <!-- Player card -->
    <section class="player-card">
      <img id="cover" class="cover" src="assets/covers/1.jpg" alt="Album cover" />

      <div class="song-info">
        <h1 id="title">Song Title</h1>
        <p id="artist">Artist Name</p>
      </div>

      <div class="progress-area">
        <input type="range" id="progress" min="0" max="100" value="0" />
        <div class="time-row">
          <span id="current-time">0:00</span>
          <span id="duration">0:00</span>
        </div>
      </div>

      <div class="controls">
        <button id="prev" class="btn" aria-label="Previous">⏮</button>
        <button id="play" class="btn btn-play" aria-label="Play">▶</button>
        <button id="next" class="btn" aria-label="Next">⏭</button>
      </div>

      <div class="volume-row">
        <span>🔈</span>
        <input type="range" id="volume" min="0" max="1" step="0.01" value="0.8" />
        <span>🔊</span>
      </div>
    </section>

    <!-- Playlist card (Bonus) -->
    <aside class="playlist-card">
      <h2>Playlist</h2>
      <ul id="playlist"></ul>
    </aside>

  </main>

  <audio id="audio" preload="metadata"></audio>
  <script src="js/script.js"></script>
</body>
</html>
